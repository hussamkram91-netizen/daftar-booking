name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Build APK
        run: |
          cd extracted/DaftarAlHujuzat-Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DaftarAlHujuzat-APK
          path: extracted/DaftarAlHujuzat-Android/app/build/outputs/apk/debug/app-debug.apk
          
